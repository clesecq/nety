[project]
name = "nety"
version = "0.9.0"
description = "Sign Netypareo attendance sheets (émargement) on extranet.cfai-alsace.fr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring",
    "pillow>=13.0.0",
    "questionary",
    "requests",
    "rich",
    "tomlkit",
]

[project.scripts]
nety = "nety.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nety"]

[dependency-groups]
build = [
    "pyinstaller>=6",
]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
