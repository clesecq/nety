[project]
name = "nety"
version = "0.2.0"
description = "Sign Netypareo attendance sheets (émargement) on extranet.cfai-alsace.fr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["questionary", "requests", "tomlkit"]

[project.scripts]
nety = "nety:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["nety.py"]
