name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest
      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import nety; print(nety.__version__)')"

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Oldest supported Ubuntu: the binary needs glibc >= the build host's.
          - os: ubuntu-22.04
            asset: nety-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: nety-linux-arm64
          - os: macos-14
            asset: nety-macos-arm64
          - os: windows-latest
            asset: nety-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # uv-managed Pythons load Tcl/Tk through an $ORIGIN rpath PyInstaller does not follow.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group build
      # keyring finds its backends through entry points, which need the metadata.
      - run: uv run pyinstaller --onefile --name nety --collect-all keyring --copy-metadata keyring src/nety/__main__.py
      - name: Smoke test
        run: |
          dist/nety --help
          dist/nety settings path
      # No display on Linux runners: Tk loads, then fails to open the window.
      - name: Check Tk is bundled
        if: runner.os == 'Linux'
        run: |
          out=$(dist/nety signature draw --output /tmp/x.png 2>&1 || true)
          echo "$out"
          grep -q "cannot open a window" <<<"$out"
      - run: mv dist/nety* "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum nety-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
