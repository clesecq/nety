name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uv run --locked pytest
      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run --locked python -c 'import nety; print(nety.__version__)')"

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Oldest supported Ubuntu: the binary needs glibc >= the build host's.
          - os: ubuntu-22.04
            asset: nety-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: nety-linux-arm64
          - os: macos-14
            asset: nety-macos-arm64
          - os: windows-latest
            asset: nety-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ASSET: ${{ matrix.asset }}
      # uv-managed Pythons load Tcl/Tk through an $ORIGIN rpath PyInstaller does not follow.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # No cache: a cache written by another ref could poison the release build.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uv sync --locked --group build
      # keyring finds its backends through entry points, which need the metadata.
      - run: uv run --locked pyinstaller --onefile --name nety --collect-all keyring --copy-metadata keyring src/nety/__main__.py
      - name: Smoke test
        run: |
          dist/nety --help
          dist/nety settings path
      # No display on Linux runners: Tk loads, then fails to open the window.
      - name: Check Tk is bundled
        if: runner.os == 'Linux'
        run: |
          out=$(dist/nety signature draw --output /tmp/x.png 2>&1 || true)
          echo "$out"
          grep -q "cannot open a window" <<<"$out"
      - run: mv dist/nety* "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum nety-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/nety-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --generate-notes --verify-tag
