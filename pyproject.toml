[project]
name = "netypareo-auto-sign-in"
version = "0.1.0"
description = "Sign Netypareo attendance sheets (émargement) on extranet.cfai-alsace.fr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.scripts]
netypareo-auto-sign-in = "netypareo_auto_sign_in:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["netypareo_auto_sign_in.py"]
