name: Workflow lint

on:
  push:
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  pull_request:
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  workflow_dispatch:
  # New audits and advisories land without any change to this repo.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
