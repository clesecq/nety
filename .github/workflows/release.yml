name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check the tag is on main.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          # Same version the binaries embed (setup-python in the build job).
          python-version: "3.13"
      - run: uv run --locked pytest
      - name: Check tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run --locked python -c 'import nety; print(nety.__version__)')"
      - name: Check tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Oldest supported Ubuntu: the binary needs glibc >= the build host's.
          - os: ubuntu-22.04
            asset: nety-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: nety-linux-arm64
          - os: macos-14
            asset: nety-macos-arm64
          - os: windows-2022
            asset: nety-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      ASSET: ${{ matrix.asset }}
      # uv-managed Pythons load Tcl/Tk through an $ORIGIN rpath PyInstaller does not follow.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # No cache: a cache written by another ref could poison the release build.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # No dev group: pytest would otherwise end up in the binary.
      - run: uv sync --locked --no-dev --group build
      - run: uv run --no-sync pyinstaller nety.spec
      # selfcheck loads Tcl/Tk, the platform keyring backend and Pillow in the frozen binary.
      - name: Smoke test
        run: |
          dist/nety --help
          dist/nety settings path
          dist/nety selfcheck
      - run: mv dist/nety* "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    # A manual run only builds, even when started on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History and tags, for the commits since the previous release.
          fetch-depth: 0
      - run: python3 .github/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum nety-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/nety-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Re-runs replace the assets and notes of a release created by an earlier attempt.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" assets/* --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
