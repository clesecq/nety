[project]
name = "nety"
version = "0.4.0"
description = "Sign Netypareo attendance sheets (émargement) on extranet.cfai-alsace.fr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["keyring", "questionary", "requests", "rich", "tomlkit"]

[project.scripts]
nety = "nety:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["nety.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
]
